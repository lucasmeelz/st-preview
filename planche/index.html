:root{
 --bleu:#0B2545; --bleu2:#0F2E52; --bleu3:#143761;
 --trait:#E8EDF2;            /* le trait et le texte : 13,06:1 */
 --annot:#9FB2C6;            /* annotations : 7,08:1 */
 --construction:#6E7F93;     /* lignes de construction — jamais du texte */
 --tampon:#C8452F;           /* aplat de tampon */
 --tampon-t:#E0674E;         /* rouge lisible en texte : 4,56:1 */
 --serif:"Libre Caslon Text",Georgia,serif;
 --annotf:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
 --marge:clamp(18px,3.4vw,56px);
 --e:cubic-bezier(.22,.61,.36,1);
}
html{background:var(--bleu);scrollbar-color:#3A5578 var(--bleu);scrollbar-width:thin;-webkit-text-size-adjust:100%}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bleu)}
::-webkit-scrollbar-thumb{background:#3A5578;border:3px solid var(--bleu)}
::selection{background:var(--tampon);color:#fff}
body{background:var(--bleu);color:var(--trait);font-family:var(--serif);font-size:17px;line-height:1.55;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:rgba(200,69,47,.25)}
:focus-visible{outline:2px solid var(--tampon-t);outline-offset:3px}
:focus:not(:focus-visible){outline:none}
button,input,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{cursor:text}
img,svg{display:block;max-width:100%}
a{color:inherit}

/* ─── voix ─── */
.an{font-family:var(--annotf);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--annot);font-weight:500}
.an--t{color:var(--trait)}
.cote{font-family:var(--annotf);font-size:12px;color:var(--annot);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tit{font-family:var(--serif);font-weight:400;line-height:1.06;letter-spacing:-.005em}
.t72{font-size:clamp(40px,6.6vw,76px)}
.t44{font-size:clamp(28px,4vw,46px)}
.t28{font-size:clamp(21px,2.3vw,29px)}
.t21{font-size:20px;line-height:1.25}
.corps{font-size:17px;line-height:1.62;color:#CBD6E2}
.corps--p{color:var(--annot);line-height:1.6}
.ital{font-style:italic}
.lab{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--trait);margin-bottom:11px}
.prix{font-family:var(--serif);font-variant-numeric:tabular-nums;letter-spacing:0}

/* ─── règles ─── */
.filet{height:1px;background:var(--construction);opacity:.5;border:0}
.filet--f{opacity:.28}

/* ─── boutons ─── */
.act{font-family:var(--annotf);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
 min-height:46px;padding:0 22px;display:inline-flex;align-items:center;gap:10px;
 border:1px solid var(--trait);color:var(--trait);background:none;transition:background .16s var(--e),color .16s var(--e)}
.act:hover{background:var(--trait);color:var(--bleu)}
.act--r{background:var(--tampon);border-color:var(--tampon);color:#fff}
.act--r:hover{background:#B23A26;border-color:#B23A26;color:#fff}
.act[disabled]{opacity:.45;cursor:not-allowed}
.lien{font-family:var(--annotf);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--annot);
 min-height:44px;display:inline-flex;align-items:center;position:relative;font-weight:500;transition:color .16s var(--e)}
.lien::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:1px;background:currentColor;
 transform:scaleX(0);transform-origin:right;transition:transform .3s var(--e)}
.lien:hover{color:var(--trait)}
.lien:hover::after{transform:scaleX(1);transform-origin:left}

/* ─── en-tête ─── */
.top{position:sticky;top:0;z-index:60;background:var(--bleu);border-bottom:1px solid var(--construction)}
.top__in{display:flex;align-items:center;gap:30px;padding:0 var(--marge);min-height:66px}
.marque{display:flex;flex-direction:column;line-height:1;padding:10px 0}
.marque b{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:.2em}
.marque i{font-family:var(--annotf);font-style:normal;font-size:12px;letter-spacing:.14em;color:var(--annot);margin-top:5px;font-weight:500}
.nav{display:flex;gap:4px;margin-left:14px}
.nav button,.outils button{font-family:var(--annotf);font-size:13px;letter-spacing:.05em;color:var(--annot);
 min-height:46px;padding:0 12px;font-weight:500;transition:color .16s var(--e)}
.nav button:hover,.outils button:hover,.nav button.on{color:var(--trait)}
.nav button.on{position:relative}
.nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:14px;height:1px;background:var(--tampon)}
.outils{margin-left:auto;display:flex;gap:2px;align-items:center}
.cnt{font-family:var(--annotf);font-size:12px;min-width:19px;height:19px;border-radius:50%;background:var(--tampon);color:#fff;
 display:inline-flex;align-items:center;justify-content:center;margin-left:7px;font-weight:600}
.cnt[data-v="0"]{background:none;color:var(--annot);border:1px solid var(--construction)}
.menu-m{display:none}

/* ─── la planche ─── */
.vue{display:none}
.vue.on{display:block}

/* le cartouche : le bloc d’identification de la planche */
.cartouche{display:grid;grid-template-columns:1.05fr .95fr;border-bottom:1px solid var(--construction)}
.cartouche__t{padding:clamp(40px,5vw,74px) var(--marge);display:flex;flex-direction:column;justify-content:center;
 gap:22px;border-right:1px solid var(--construction);position:relative}
.cartouche__t::after{content:"";position:absolute;left:var(--marge);bottom:clamp(26px,3vw,44px);width:64px;height:1px;background:var(--tampon)}
.ident{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline;
 border-top:1px solid var(--construction);border-bottom:1px solid var(--construction);padding:14px 0;max-width:36em}
.ident dt{font-family:var(--annotf);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--annot);font-weight:500}
.ident dd{font-family:var(--serif);font-size:17px}
.fig--grande{width:min(100%,520px)}
.fig--fiche{width:min(100%,520px)}
.cartouche__f{position:relative;display:flex;align-items:center;justify-content:center;padding:clamp(30px,4vw,64px);min-height:clamp(420px,52vw,600px)}

/* la figure : le dessin au trait */
.fig{width:100%;height:auto;display:block;overflow:visible}
.fig .obj{fill:none;stroke:var(--trait);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;
 vector-effect:non-scaling-stroke}
.fig .obj--f{fill:var(--bleu)}
.fig .cons{fill:none;stroke:var(--construction);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.fig .sol{stroke:var(--construction);stroke-width:1;vector-effect:non-scaling-stroke}
.fig .hach{stroke:var(--construction);stroke-width:.8;vector-effect:non-scaling-stroke;opacity:.75}
.fig text{fill:var(--annot);font-family:var(--annotf);font-size:9px;letter-spacing:.06em}

/* le tirage photographique contrecollé */
.tirage{background:#fff;padding:10px;position:relative}
.tirage .ph{display:block;background-size:cover;background-position:center;background-color:#E7E9EC;aspect-ratio:4/5}
.tirage__l{font-family:var(--annotf);font-size:12px;letter-spacing:.06em;color:#5B6B7D;padding-top:9px;text-transform:uppercase}

/* ─── section ─── */
.sec{padding:clamp(48px,6vw,92px) var(--marge);border-bottom:1px solid var(--construction)}
.sec__h{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:10px}
.sec__s{max-width:56ch;margin-top:14px}

/* la planche de figures */
.planche{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--construction);
 border-left:1px solid var(--construction);margin-top:34px}
.case{position:relative;border-right:1px solid var(--construction);border-bottom:1px solid var(--construction);
 display:block;width:100%;text-align:left;padding:22px 18px 18px;background:none;transition:background .2s var(--e)}
.case:hover,.case:focus-visible{background:var(--bleu2)}
.case__n{position:absolute;top:12px;left:14px;font-family:var(--annotf);font-size:12px;color:var(--annot);
 font-variant-numeric:tabular-nums;letter-spacing:.04em}
.case__d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin-bottom:16px;position:relative}
.case__d .fig{width:82%}
.case__ph{position:absolute;inset:6%;background-size:contain;background-repeat:no-repeat;background-position:center;
 opacity:0;transition:opacity .34s var(--e)}
.case:hover .case__ph,.case:focus-visible .case__ph{opacity:1}
.case:hover .fig,.case:focus-visible .fig{opacity:0;transition:opacity .34s var(--e)}
.mode-photo .case__ph{opacity:1}
.mode-photo .case .fig{opacity:0}
.case__t{font-family:var(--serif);font-size:17px;line-height:1.2;display:block;margin-bottom:6px}
.case__p{font-family:var(--annotf);font-size:12px;color:var(--annot);letter-spacing:.03em;
 display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.case--off{opacity:.42}
.case--off .case__p b{color:var(--tampon-t);font-weight:500}

/* bascule trait / photographie */
.bascule{display:inline-flex;border:1px solid var(--construction)}
.bascule button{font-family:var(--annotf);font-size:12px;letter-spacing:.07em;text-transform:uppercase;
 min-height:42px;padding:0 16px;color:var(--annot);font-weight:500}
.bascule button.on{background:var(--trait);color:var(--bleu)}

/* ─── le bon de commande (choix de retrait) ─── */
.bon{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--construction);
 padding:12px 16px;margin-top:26px}
.bon__l{font-family:var(--annotf);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--annot);font-weight:500}
.bon__v{font-family:var(--serif);font-size:17px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bon__v b{font-weight:400}
.bon__x{font-family:var(--annotf);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--annot);
 min-height:44px;display:inline-flex;align-items:center;border-bottom:1px solid currentColor}
.bon__x:hover{color:var(--trait)}
.bon__n{margin-left:auto;font-family:var(--annotf);font-size:12px;color:var(--annot)}

/* légende de filtres */
.legende{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.legende button{font-family:var(--annotf);font-size:12px;letter-spacing:.04em;min-height:42px;padding:0 14px;
 border:1px solid var(--construction);color:var(--annot);font-weight:500;transition:all .16s var(--e)}
.legende button:hover{color:var(--trait);border-color:var(--trait)}
.legende button.on{background:var(--trait);border-color:var(--trait);color:var(--bleu)}
.denombre{font-family:var(--annotf);font-size:12px;color:var(--annot);margin-top:14px;font-variant-numeric:tabular-nums}

/* ─── la fiche ─── */
.fiche__h{padding:26px var(--marge) 0}
.fil{font-family:var(--annotf);font-size:12px;color:var(--annot);letter-spacing:.04em}
.fil button{color:inherit;font:inherit;min-height:34px}
.fil button:hover{color:var(--trait)}
.fiche__g{display:grid;grid-template-columns:1.1fr .9fr;border-top:1px solid var(--construction);
 border-bottom:1px solid var(--construction);margin-top:22px}
.fiche__d{border-right:1px solid var(--construction);padding:clamp(30px,4vw,60px);display:flex;
 flex-direction:column;align-items:center;justify-content:center;gap:26px;position:relative}
.fiche__d .fig{width:min(100%,530px)}
.fiche__c{padding:clamp(30px,4vw,58px) clamp(24px,3.4vw,52px);display:flex;flex-direction:column;gap:26px}
.fiche__t{font-size:clamp(30px,3.6vw,44px);line-height:1.04}

/* les formats, dessinés à l’échelle du cadre */
.fmts{display:flex;gap:0;border:1px solid var(--construction);align-items:stretch}
.fmt{flex:1;padding:14px 12px 12px;border-right:1px solid var(--construction);display:flex;flex-direction:column;
 align-items:center;gap:9px;justify-content:flex-end;transition:background .16s var(--e);min-height:132px}
.fmt:last-child{border-right:0}
.fmt:hover{background:var(--bleu2)}
.fmt.on{background:var(--tampon)}
.fmt.on .fmt__n,.fmt.on .fmt__p{color:#fff}
.fmt.on .fig .obj{stroke:#fff}
.fmt__d{flex:1;display:flex;align-items:flex-end;justify-content:center;width:100%}
.fmt__d > span{display:block}
.fmt__n{font-family:var(--annotf);font-size:12px;letter-spacing:.05em;color:var(--annot);text-align:center;font-weight:500}
.fmt__p{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums}

/* annotations de composition */
.notice{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--construction)}
.notice > div{padding:clamp(26px,3vw,44px) var(--marge);border-right:1px solid var(--construction)}
.notice > div:last-child{border-right:0}
.notice h3{font-family:var(--serif);font-style:italic;font-size:20px;font-weight:400;margin-bottom:12px}
.notice p{font-size:17px;color:#C3D0DE;line-height:1.6}
.notice p + p{margin-top:10px;color:var(--annot)}

/* bloc de commande */
.cmd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:6px}
.qte{display:inline-flex;align-items:center;border:1px solid var(--construction)}
.qte button{width:44px;height:46px;display:grid;place-items:center;color:var(--annot);font-size:20px}
.qte button:hover{color:var(--trait)}
.qte span{min-width:36px;text-align:center;font-variant-numeric:tabular-nums;font-family:var(--annotf);font-size:17px}
.tot{font-family:var(--serif);font-size:30px;font-variant-numeric:tabular-nums;margin-left:auto}

/* ─── le tampon : l’état confirmé ─── */
.tampon{position:fixed;inset:0;display:grid;place-items:center;z-index:200;pointer-events:none;opacity:0}
.tampon.on{opacity:1}
.tampon__m{border:3px solid var(--tampon-t);color:var(--tampon-t);padding:16px 34px;transform:rotate(-7deg);
 font-family:var(--annotf);font-size:clamp(20px,3.4vw,34px);letter-spacing:.14em;text-transform:uppercase;font-weight:600;
 background:rgba(11,37,69,.9)}
.tampon.on .tampon__m{animation:frappe .5s var(--e) both}
@keyframes frappe{0%{transform:rotate(-7deg) scale(2.4);opacity:0}55%{opacity:1}100%{transform:rotate(-7deg) scale(1);opacity:1}}

/* ─── voile, tiroir, modale ─── */
.voile{position:fixed;inset:0;background:rgba(4,16,31,.72);z-index:100;opacity:0;visibility:hidden;
 transition:opacity .3s var(--e),visibility .3s}
.voile.on{opacity:1;visibility:visible}
.pan{position:fixed;top:0;right:0;bottom:0;width:min(468px,100vw);background:var(--bleu);z-index:110;
 border-left:1px solid var(--construction);display:flex;flex-direction:column;transform:translateX(100%);
 transition:transform .38s var(--e);visibility:hidden}
.pan.on{transform:none;visibility:visible}
.pan__h{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px var(--marge);
 border-bottom:1px solid var(--construction)}
.pan__c{flex:1;overflow-y:auto;padding:22px var(--marge)}
.pan__f{border-top:1px solid var(--construction);padding:18px var(--marge)}
.ligne{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:start;padding:16px 0;
 border-bottom:1px solid var(--construction)}
.ligne .fig{width:100%}
.mod{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(620px,calc(100vw - 28px));
 max-height:88vh;overflow-y:auto;background:var(--bleu);border:1px solid var(--construction);z-index:110;
 opacity:0;visibility:hidden;transition:opacity .26s var(--e),transform .26s var(--e),visibility .26s}
.mod.on{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.mod__c{padding:26px var(--marge)}
.opt{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0;border:1px solid var(--construction);margin-top:12px}
.opt button{padding:13px 10px;border-right:1px solid var(--construction);min-height:52px;
 font-family:var(--annotf);font-size:13px;color:var(--annot);letter-spacing:.03em;text-align:center}
.opt button:last-child{border-right:0}
.opt button.on{background:var(--trait);color:var(--bleu)}
.opt button[disabled]{opacity:.35}
.jours{display:flex;gap:0;border:1px solid var(--construction);overflow-x:auto;margin-top:12px}
.jours button{flex:1;min-width:74px;padding:11px 6px;border-right:1px solid var(--construction);min-height:64px;
 font-family:var(--annotf);font-size:12px;color:var(--annot);display:flex;flex-direction:column;gap:3px;align-items:center}
.jours button:last-child{border-right:0}
.jours button b{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--trait)}
.jours button.on{background:var(--trait);color:var(--bleu)}
.jours button.on b{color:var(--bleu)}
.jours button[disabled]{opacity:.32}

/* ─── recherche ─── */
.rech{position:fixed;top:0;left:0;right:0;background:var(--bleu);border-bottom:1px solid var(--construction);
 z-index:120;transform:translateY(-100%);transition:transform .34s var(--e);visibility:hidden;max-height:100dvh;overflow-y:auto}
.rech.on{transform:none;visibility:visible}
.rech__in{padding:22px var(--marge) 28px}
.rech input{width:100%;background:none;border:0;border-bottom:1px solid var(--construction);
 font-family:var(--serif);font-size:clamp(24px,3.4vw,40px);padding:10px 0;color:var(--trait)}
.rech input::placeholder{color:var(--annot)}

/* ─── pied ─── */
.pied{padding:clamp(48px,5vw,80px) var(--marge) 32px}
.pied__g{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:44px}
.pied h4{font-family:var(--annotf);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--annot);
 margin-bottom:14px;font-weight:600}
.pied li{list-style:none}
.pied li button,.pied li span{font-family:var(--serif);font-size:17px;display:block;text-align:left;
 min-height:40px;line-height:40px;padding:0;color:var(--trait)}
.pied li button:hover{color:var(--tampon-t)}
.pied__b{margin-top:44px;padding-top:20px;border-top:1px solid var(--construction);display:flex;flex-wrap:wrap;
 gap:8px 26px;font-family:var(--annotf);font-size:12px;color:var(--annot)}
.inf{display:flex;gap:10px;margin-top:14px;max-width:400px}
.inf input{flex:1;background:none;border:0;border-bottom:1px solid var(--construction);color:var(--trait);
 padding:10px 0;font-family:var(--serif);font-size:17px;min-height:46px}
.inf input::placeholder{color:var(--annot)}

/* ─── adresses ─── */
.adr{display:grid;grid-template-columns:repeat(2,1fr);gap:0 56px;margin-top:30px}
.adr li{list-style:none;padding:18px 0;border-top:1px solid var(--construction)}
.adr b{font-family:var(--serif);font-size:20px;font-weight:400;display:block;margin-bottom:5px}
.adr span{display:block;font-family:var(--annotf);font-size:13px;color:var(--annot);line-height:1.55}

.avis{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--trait);color:var(--bleu);
 padding:13px 22px;font-family:var(--annotf);font-size:13px;z-index:210;opacity:0;transition:opacity .24s,transform .24s;
 letter-spacing:.02em;max-width:calc(100vw - 32px)}
.avis.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ─── adaptations ─── */

 .planche{grid-template-columns:repeat(4,1fr)}

THESIS : la pâtisserie se lit comme une architecture. Cette planche refuse l’arrangement

de tampon pour l’état choisi ; Caslon (gravé 1722-1730) pour les noms, Archivo Narrow pour les
annotations ; aucun arrondi, aucune ombre, aucun dégradé ; les photographies entrent comme des

STORY : le visiteur comprend qu’il achète un objet dessiné, daté et fabriqué au même endroit
depuis 1730 ; il choisit son retrait, puis sa pièce, puis son format.
FIRST VIEWPORT : à gauche le cartouche d’identification — titre, puis un tableau maison/fondée/
adresse/décor, puis deux actions ; à droite, sur toute la hauteur, le baba dessiné en élévation.

FORM : la gravure de pièce montée, candidat 4 de la liste ordonnée. Clé de tirage 70db740d.
FINISH : unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.

function assiette(l){

/* hachures obliques, découpées à la main dans le rectangle (pas de clip-path :
   les identifiants se dupliqueraient d’une figure à l’autre sur la planche) */
function hachures(x1, y1, x2, y2, pas) {
 var p = '', x, h = y2 - y1, t0, t1;
 pas = pas || 6;
 for (x = x1 - h; x < x2; x += pas) {
  t0 = Math.max(0, x1 - x);
  t1 = Math.min(h, x2 - x);
  if (t1 - t0 < 1) continue;
  p += '<line class="hach" x1="' + (x + t0).toFixed(1) + '" y1="' + (y2 - t0).toFixed(1) +
       '" x2="' + (x + t1).toFixed(1) + '" y2="' + (y2 - t1).toFixed(1) + '"/>';
 }
 return p;
}

  '</div></section>';

 h += adresses() + pied();
 $('#v-accueil').innerHTML = h;
}

function adresses() {
 return '<section class="sec"><div class="sec__h"><h2 class="tit t44">Où nous trouver</h2></div>' +
  '<ul class="adr">' + LIEUX.map(function (L) {
   return '<li><b>' + esc(L.n) + '</b><span>' + esc(L.a) + '</span><span>' + esc(L.h) + '</span></li>';
  }).join('') + '</ul></section>';
}

/* ═══ la planche filtrée ═══ */
function liste() {
 return C.filter(function (c) { return COL === 'tout' || c.col === COL; })
  .filter(function (c) {
   return FIL.every(function (f) {
    if (f === 'indiv') return c.f.some(function (x) { return /individuel|bocal/.test(x[0]); });
    if (f === 'partager') return c.f.some(function (x) { return /personnes/.test(x[0]); });
    if (f === 'voyage') return !c.frais;
    if (f === 'dispo') return dispo(c);
    return true;
   });
  });
}
function vCarte() {
 var t = TIT[COL] || TIT.tout, l = liste(), h = '';
 h += '<div class="sec" style="border-bottom:0;padding-bottom:0">' +
  '<h1 class="tit t72">' + esc(t[0]) + '</h1>' +
  '<p class="corps sec__s">' + esc(t[1]) + '</p>' +
  bon(null) +
  '<div class="legende">' + FILT.map(function (f) {
   return '<button data-f="' + f[0] + '" aria-pressed="' + (FIL.indexOf(f[0]) >= 0) + '" class="' +
    (FIL.indexOf(f[0]) >= 0 ? 'on' : '') + '">' + f[1] + '</button>';
  }).join('') + '<span style="margin-left:auto">' + bascule() + '</span></div>' +
  '<p class="denombre" aria-live="polite">' + l.length + ' création' + (l.length > 1 ? 's' : '') + ' sur ' + C.length + '</p>' +
  (l.length ? planche(l) :
   '<div style="padding:64px 0"><p class="tit t28">Aucune création ne réunit ces critères.</p>' +
   '<div style="display:flex;gap:12px;margin-top:22px;flex-wrap:wrap">' +
   '<button class="act" data-vider="1">Effacer les critères</button>' +
   '<button class="act act--r" data-retrait="1">Changer de mode de retrait</button></div></div>') +
  '</div>';
 h += pied();
 $('#v-carte').innerHTML = h;
}

/* ═══ la fiche ═══ */
function vFiche() {
 var c = FICHE; if (!c) return;
 var f = c.f[FMT], off = !dispo(c);
 var suite = C.filter(function (x) { return x.id !== c.id && x.col === c.col; }).slice(0, 5);
 var h = '';
 h += '<div class="fiche__h"><p class="fil"><button data-go="carte" data-col="tout">La planche</button> · ' +
  '<button data-go="carte" data-col="' + c.col + '">' + esc(TIT[c.col][0]) + '</button> · ' + esc(c.n) + '</p></div>';

 h += '<div class="fiche__g"><div class="fiche__d">' +
   figure(c.id, 'fig--fiche') +
   '<p class="cote">Fig. ' + (C.indexOf(c) + 1) + ' — ' + esc(c.n) + ', élévation</p>' +
  '</div><div class="fiche__c">' +
  '<h1 class="tit fiche__t">' + esc(c.n) + '</h1>' +
  '<p class="corps ital" style="max-width:46ch">' + esc(c.d) + '</p>' +
  '<div><p class="lab">Format</p><div class="fmts" role="group" aria-label="Format">' +
   c.f.map(function (x, i) {
    var e = [38, 66, 88, 100][Math.min(i, 3)];
    return '<button class="fmt' + (i === FMT ? ' on' : '') + '" data-fmt="' + i + '" aria-pressed="' + (i === FMT) + '">' +
     '<span class="fmt__d"><span style="width:' + e + '%">' + figure(c.id, '', true) + '</span></span>' +
     '<span class="fmt__n">' + esc(x[0]) + '</span><span class="fmt__p">' + pr(x[1]) + '</span></button>';
   }).join('') + '</div></div>' +
  '<div><p class="lab">Retrait</p>' +
   '<div class="bon" style="margin-top:0"><span class="bon__v"><b>' + esc(retraitTxt()) + '</b>' +
   '<button class="bon__x" data-retrait="1">Modifier</button></span></div>' +
   (off ? '<p class="cote" style="color:#E0674E;margin-top:10px">Cette création ne s’expédie pas : elle se retire en boutique ou se fait livrer à Paris.</p>' : '') +
  '</div>' +
  '<div class="cmd">' +
   '<span class="qte"><button data-q="-1" aria-label="Retirer un">−</button><span id="qte">' + QTE + '</span>' +
   '<button data-q="1" aria-label="Ajouter un">+</button></span>' +
   '<span class="tot prix">' + pr(f[1] * QTE) + '</span></div>' +
  '<button class="act act--r" data-ajouter="1" style="width:100%;justify-content:center"' + (off ? ' disabled' : '') + '>Ajouter à ma commande</button>' +
  '</div></div>';

 h += '<div class="notice">' +
  '<div><h3>Composition</h3><p>' + esc(c.c) + '</p></div>' +
  '<div><h3>Allergènes</h3><p>' + c.a.join(', ') + '.</p>' +
   '<p>Traces éventuelles non précisées sur les fiches actuelles : tout est confectionné dans le même laboratoire, rue Montorgueil.</p></div>' +
  '<div><h3>Conservation</h3><p>' + esc(c.cons) + '</p></div></div>';

 h += '<section class="sec"><div class="sec__h"><h2 class="tit t44">La photographie</h2></div>' +
  '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px;max-width:720px;margin-top:24px">' +
  tirage(c.im, c.n + ', pâtisserie Stohrer', c.n) +
  (c.im2 ? tirage(c.im2, c.n + ', seconde vue', 'Autre vue') : '') + '</div></section>';

 if (suite.length) {
  h += '<section class="sec"><div class="sec__h"><h2 class="tit t44">La suite de la planche</h2>' +
   '<button class="lien" data-go="carte" data-col="tout">Tout voir</button></div>' + planche(suite) + '</section>';
 }
 h += pied();
 $('#v-fiche').innerHTML = h;
}
function majFiche() { vFiche(); }

/* ═══ la maison ═══ */
function vMaison() {
 var h = '<div class="sec" style="border-bottom:0">' +
  '<h1 class="tit t72" style="max-width:16ch">La plus ancienne pâtisserie de Paris</h1>' +
  '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:48px;align-items:start;margin-top:30px">' +
  '<div><p class="corps" style="max-width:60ch">Stohrer a été fondée en 1730 par le pâtissier du roi Louis XV, Nicolas Stohrer. ' +
   'Cette institution de la rue Montorgueil a tout d’un mythe : un décor somptueux classé Monuments Historiques, signé par un élève ' +
   'de Paul Baudry, qui a œuvré au décor de l’Opéra Garnier. Un temple du sucré et du salé, où l’on confectionne tout sur place pour ' +
   'proposer, siècle après siècle, le meilleur de la pâtisserie classique française.</p>' +
   '<p class="corps corps--p" style="max-width:60ch;margin-top:16px">Nicolas Stohrer était le pâtissier de Stanislas Leszczynski, ' +
   'ex-roi de Pologne et père de Marie Leszczynska, future épouse de Louis XV. Il est le créateur du baba au rhum, que la maison ' +
   'réalise sans interruption depuis.</p></div>' +
  tirage('maison1', 'Photographies d’archives de la maison Stohrer', 'Archives de la maison') +
  '</div></div>' + adresses() + pied();
 $('#v-maison').innerHTML = h;
}

/* ═══ pied ═══ */
function pied() {
 return '<footer class="pied"><div class="pied__g">' +
  '<div><span class="marque" role="img" aria-label="Stohrer, Paris"><b>STOHRER</b><i>PARIS</i></span>' +
   '<h4 style="margin-top:24px">Nos nouvelles</h4>' +
   '<p class="corps corps--p" style="max-width:38ch">Les créations de saison, les fêtes et les rendez-vous de la maison, quelques fois par an.</p>' +
   '<form class="inf" data-inf="1"><label class="sr" for="mail">Votre adresse e-mail</label>' +
   '<input id="mail" type="email" placeholder="Votre adresse e-mail" required><button class="act" type="submit">S’inscrire</button></form></div>' +
  '<div><h4>Nos pâtisseries</h4><ul>' +
   '<li><button data-go="carte" data-col="historiques">Les historiques</button></li>' +
   '<li><button data-go="carte" data-col="saison">Créations de saison</button></li>' +
   '<li><button data-go="carte" data-col="voyage">Gâteaux de voyage</button></li>' +
   '<li><button data-go="carte" data-col="tout">Toute la planche</button></li></ul></div>' +
  '<div><h4>La maison</h4><ul>' +
   '<li><button data-go="maison">Nos boutiques</button></li>' +
   '<li><button data-go="maison">Notre histoire</button></li>' +
   '<li><span>Nous rejoindre</span></li></ul></div>' +
  '<div><h4>Informations</h4><ul>' +
   '<li><span>Modalités de livraison</span></li>' +
   '<li><span>Conservation et dégustation</span></li>' +
   '<li><span>Nous contacter</span></li></ul></div>' +
  '</div><div class="pied__b"><span>Maison fondée en 1730</span><span>Retrait gratuit sous 24 h</span>' +
  '<span>Livraison Paris 14,90 €, offerte dès 90 €</span><span>Mentions légales</span><span>CGV</span>' +
  '<span>© Stohrer 2026</span></div></footer>';
}

/* ═══ navigation ═══ */
function vE(v) { return document.getElementById('v-' + v); }
function courante() { for (var i = 0; i < VUES.length; i++) if (vE(VUES[i]).classList.contains('on')) return VUES[i]; return 'accueil'; }
function aller(v, o) {
 o = o || {};
 MEM[courante()] = window.scrollY || 0;
 VUES.forEach(function (x) { vE(x).classList.toggle('on', x === v); });
 window.scrollTo(0, o.retour ? (MEM[v] || 0) : 0);
 $$('.nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-go') === v); });
 vE(v).focus({ preventScroll: true });
}

function tout() { vAccueil(); vCarte(); if (FICHE) vFiche(); vMaison(); majPanier(); appliquerMode(); }
function appliquerMode() { document.body.classList.toggle('mode-photo', MODEV === 'photo'); }

/* ═══ panier ═══ */
function sousTotal() { return PANIER.reduce(function (s, l) { return s + l.p * l.q; }, 0); }
function majPanier() {
 var n = PANIER.reduce(function (s, l) { return s + l.q; }, 0);
 var e = $('#cnt'); e.textContent = n; e.setAttribute('data-v', n);
 var c = $('#pan-c'), f = $('#pan-f');
 if (!PANIER.length) {
  c.innerHTML = '<p class="corps">Votre commande est vide.</p>' +
   '<p class="corps corps--p" style="margin-top:10px">Quinze créations vous attendent sur la planche.</p>' +
   '<div style="margin-top:20px"><button class="act" data-go="carte" data-col="tout">Voir la planche</button></div>';
  f.innerHTML = '';
  return;
 }
 c.innerHTML = PANIER.map(function (l, i) {
  return '<div class="ligne"><span>' + figure(l.id, '', true) + '</span>' +
   '<span><b class="tit t21">' + esc(l.n) + '</b><br><span class="cote">' + esc(l.f) + '</span><br>' +
   '<button class="lien" data-retirer="' + i + '" style="min-height:34px">Retirer</button></span>' +
   '<span class="prix">' + pr(l.p * l.q) + (l.q > 1 ? '<br><span class="cote">× ' + l.q + '</span>' : '') + '</span></div>';
 }).join('');
 f.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">' +
  '<span class="lab" style="margin:0">Sous-total</span><span class="prix" style="font-size:22px">' + pr(sousTotal()) + '</span></div>' +
  '<p class="cote" style="margin-bottom:14px">' + esc(retraitTxt()) + '</p>' +
  '<button class="act act--r" data-payer="1" style="width:100%;justify-content:center">Payer ma commande</button>';
}

/* ═══ panneaux ═══ */
var ouvert = null, rendu = null;
function ouvre(el, focus) {
 rendu = document.activeElement;
 $('#voile').classList.add('on');
 el.classList.add('on');
 el.removeAttribute('aria-hidden');
 document.body.style.overflow = 'hidden';
 ouvert = el;
 var f = focus || el.querySelector('button,input,[tabindex]');
 if (f) f.focus();
}
function ferme() {
 if (!ouvert) return;
 $('#voile').classList.remove('on');
 ouvert.classList.remove('on');
 ouvert.setAttribute('aria-hidden', 'true');
 document.body.style.overflow = '';
 ouvert = null;
 if (rendu && rendu.focus) rendu.focus();
}

/* ═══ la modale de retrait ═══ */
function vModale() {
 var n = C.filter(function (c) { return T.mode !== 'expedition' || !c.frais; }).length;
 $('#mod-c').innerHTML =
  '<h2 class="tit t28" id="mod-t">Comment souhaitez-vous recevoir votre commande ?</h2>' +
  '<div style="margin-top:22px"><p class="lab">Mode</p><div class="opt">' +
   MODES.map(function (m) {
    return '<button data-m="' + m[0] + '" class="' + (T.mode === m[0] ? 'on' : '') + '">' + m[1] + '</button>';
   }).join('') + '</div></div>' +
  (T.mode === 'retrait' ? '<div style="margin-top:22px"><p class="lab">Boutique</p><div class="opt" style="grid-template-columns:1fr">' +
   LIEUX.map(function (L, i) {
    return '<button data-l="' + i + '" class="' + (T.lieu === i ? 'on' : '') + '" style="text-align:left;border-right:0;border-bottom:1px solid var(--construction)">' +
     esc(L.n) + '</button>';
   }).join('') + '</div></div>' : '') +
  '<div style="margin-top:22px"><p class="lab">Jour</p><div class="jours">' +
   JOURS.map(function (J, i) {
    return '<button data-j="' + i + '"' + (J.ouvert ? '' : ' disabled') + ' class="' + (T.jour === i ? 'on' : '') + '">' +
     '<b>' + J.n + '</b><span>' + J.j.slice(0, 3) + '</span></button>';
   }).join('') + '</div></div>' +
  '<div style="margin-top:22px"><p class="lab">Créneau</p><div class="opt">' +
   CREN.map(function (K, i) {
    return '<button data-k="' + i + '"' + (K[1] ? '' : ' disabled') + ' class="' + (T.cren === i ? 'on' : '') + '">' + K[0] + '</button>';
   }).join('') + '</div></div>' +
  '<p class="cote" style="margin-top:20px">' + n + ' création' + (n > 1 ? 's' : '') + ' sur ' + C.length +
   ' disponible' + (n > 1 ? 's' : '') + ' pour ce mode.</p>' +
  '<div style="display:flex;gap:12px;margin-top:18px;flex-wrap:wrap">' +
   '<button class="act act--r" data-valider="1">Valider</button>' +
   '<button class="act" data-fermer="1">Annuler</button></div>';
}
function ouvrirRetrait() { T = { mode: S.mode, lieu: S.lieu, jour: S.jour, cren: S.cren }; vModale(); ouvre($('#mod')); }
function validerRetrait() { S = { mode: T.mode, lieu: T.lieu, jour: T.jour, cren: T.cren }; ferme(); tout(); avis('Retrait mis à jour : ' + retraitTxt()); }

/* ═══ recherche ═══ */
function rech(q) {
 var r = $('#rech-r');
 if (!q.trim()) { r.innerHTML = '<p class="corps corps--p">Essayez « baba », « 8 personnes », « chocolat », « citron ».</p>'; return; }
 var n = q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
 var l = C.filter(function (c) {
  var t = (c.n + ' ' + c.d + ' ' + c.c + ' ' + c.f.map(function (x) { return x[0]; }).join(' ')).toLowerCase()
   .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return t.indexOf(n) >= 0;
 });
 r.innerHTML = l.length ? planche(l)
  : '<p class="corps">Aucune création ne correspond à « ' + esc(q) + ' ». ' +
    '<button class="lien" data-go="carte" data-col="tout">Voir les ' + C.length + ' créations</button></p>';
}

/* ═══ le tampon : l’état confirmé ═══ */
function tampon(txt) {
 var t = $('#tampon');
 t.querySelector('.tampon__m').textContent = txt;
 t.classList.add('on');
 setTimeout(function () { t.classList.remove('on'); }, RM.matches ? 900 : 1250);
}
var minuteur = null;
function avis(m) {
 var a = $('#avis'); a.textContent = m; a.classList.add('on');
 clearTimeout(minuteur); minuteur = setTimeout(function () { a.classList.remove('on'); }, 3200);
}

/* ═══ gestes ═══ */
document.addEventListener('click', function (e) {
 var t = e.target.closest('button,[data-go],form'); if (!t) return;
 var d = t.dataset || {};

 if (d.fermer !== undefined || t.id === 'voile') { ferme(); return; }
 if (d.retrait) { ouvrirRetrait(); return; }
 if (d.valider) { validerRetrait(); return; }
 if (d.m) { T.mode = d.m; vModale(); return; }
 if (d.l != null && d.l !== '') { T.lieu = +d.l; vModale(); return; }
 if (d.j != null && d.j !== '') { T.jour = +d.j; vModale(); return; }
 if (d.k != null && d.k !== '') { T.cren = +d.k; vModale(); return; }

 if (d.vp) { MODEV = d.vp; appliquerMode(); $$('.bascule button').forEach(function (b) {
   var on = b.getAttribute('data-vp') === MODEV; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); return; }

 if (d.fiche) { FICHE = par(d.fiche); FMT = 0; QTE = 1; vFiche(); ferme(); aller('fiche'); return; }
 if (d.go) { if (d.col) COL = d.col; if (d.col) { FIL = []; vCarte(); } ferme(); aller(d.go); return; }

 if (d.f) { var i = FIL.indexOf(d.f); if (i >= 0) FIL.splice(i, 1); else FIL.push(d.f); vCarte(); return; }
 if (d.vider) { FIL = []; vCarte(); return; }

 if (d.fmt != null && d.fmt !== '') { FMT = +d.fmt; QTE = 1; majFiche(); return; }
 if (d.q) {
  QTE = Math.max(1, Math.min(20, QTE + (+d.q)));
  $('#qte').textContent = QTE;
  $('#v-fiche .tot').textContent = pr(FICHE.f[FMT][1] * QTE);
  return;
 }
 if (d.ajouter) {
  var c = FICHE, f = c.f[FMT];
  var ex = PANIER.filter(function (l) { return l.id === c.id && l.f === f[0]; })[0];
  if (ex) ex.q += QTE; else PANIER.push({ id: c.id, n: c.n, f: f[0], p: f[1], q: QTE });
  majPanier(); tampon('Ajouté'); QTE = 1; $('#qte').textContent = 1;
  $('#v-fiche .tot').textContent = pr(f[1]);
  return;
 }
 if (d.retirer != null && d.retirer !== '') { PANIER.splice(+d.retirer, 1); majPanier(); return; }
 if (d.payer) { avis('Le paiement n’est pas maquetté à ce stade.'); return; }

 if (t.id === 'btn-panier') { ouvre($('#pan')); return; }
 if (t.id === 'btn-rech') {
  $('#rech').classList.add('on'); $('#voile').classList.add('on');
  $('#rech').removeAttribute('aria-hidden'); ouvert = $('#rech');
  rendu = document.activeElement; $('#rech-i').focus(); rech('');
  return;
 }
 if (t.id === 'btn-menu') { COL = 'tout'; FIL = []; vCarte(); aller('carte'); return; }
 if (d.compte !== undefined) { avis('L’espace client n’est pas maquetté à ce stade.'); return; }
});

document.addEventListener('submit', function (e) {
 if (e.target.dataset.inf !== undefined) { e.preventDefault(); e.target.reset(); avis('Merci — vous recevrez nos nouvelles.'); }
});
document.addEventListener('input', function (e) { if (e.target.id === 'rech-i') rech(e.target.value); });
document.addEventListener('keydown', function (e) {
 if (e.key === 'Escape' && ouvert) { ferme(); return; }
 if (e.key !== 'Tab' || !ouvert) return;
 var f = $$('button,input,[href],[tabindex]:not([tabindex="-1"])', ouvert).filter(function (x) { return x.offsetParent !== null && !x.disabled; });
 if (!f.length) return;
 var p = f[0], d = f[f.length - 1];
 if (e.shiftKey && document.activeElement === p) { e.preventDefault(); d.focus(); }
 else if (!e.shiftKey && document.activeElement === d) { e.preventDefault(); p.focus(); }
});

tout();
aller('accueil');
})();

</script>
</body></html>
