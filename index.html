/* ═══ jetons ═══ */
:root{
 --papier:#F7F4EA; --blanc:#FFFFFF; --encre:#002E65; --encre2:#4A5670;
 --filet:#E0DACB; --arete:#8B8875; --saison:#8A7318; --or:#AA8F24;
 --serif:Garamond,"Iowan Old Style",Georgia,serif;
 --sans:Instrument,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
 --m-touche:180ms; --e-touche:cubic-bezier(.2,.6,.4,1);
 --m-geste:320ms;  --e-geste:cubic-bezier(.22,.7,.3,1);
 --m-passage:560ms;--e-passage:cubic-bezier(.62,.02,.2,1);
 --m-souffle:900ms; --pas:60ms;
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--papier);color:var(--encre);font-family:var(--sans);
 font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-synthesis-weight:none}
h1,h2,h3,h4,p,figure,blockquote,ul{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;box-shadow:0 0 0 4px var(--encre);outline-offset:2px;border-radius:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(prefers-reduced-motion:reduce){
 *{animation-duration:.01ms!important;transition-duration:.01ms!important}
 .crea__im .ph.b2{transition:none}
}

/* ═══ échelle ═══ */
.t12{font-size:12px;letter-spacing:.11em;text-transform:uppercase;font-weight:600}
.t14{font-size:14px}.t16{font-size:16px}.t18{font-size:18px}
.g22{font-family:var(--serif);font-size:22px;line-height:1.24;font-weight:400}
.g28{font-family:var(--serif);font-size:28px;line-height:1.2;letter-spacing:-.01em;font-weight:400}
.g38{font-family:var(--serif);font-size:clamp(28px,3.4vw,38px);line-height:1.14;letter-spacing:-.012em;font-weight:400}
.g54{font-family:var(--serif);font-size:clamp(34px,5vw,56px);line-height:1.04;letter-spacing:-.02em;font-weight:400}
.dim{color:var(--encre2)}.num{font-variant-numeric:tabular-nums}
.sais{color:var(--saison)}

/* ═══ images ═══ */
.ph{background-color:#E8E3D9;background-size:cover;background-position:center;display:block}

/* ═══ en-tête ═══ */
.top{position:sticky;top:0;z-index:60;background:var(--papier);border-bottom:1px solid var(--filet)}
.top__in{display:flex;align-items:center;gap:30px;padding:14px 44px;flex-wrap:wrap}
.logo{display:block;color:var(--encre);flex:none;line-height:1}
.logo b{display:block;font-family:var(--serif);font-size:26px;letter-spacing:.22em;font-weight:400}
.logo span{display:block;font-size:9px;letter-spacing:.2em;color:var(--or);margin-top:5px;font-weight:600}
.nav{display:flex;gap:28px;font-size:15px;color:var(--encre2)}
.nav>button{position:relative;padding:8px 0;min-height:44px}
.nav>button::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:1.5px;background:currentColor;
 transform:scaleX(0);transform-origin:right;transition:transform var(--m-geste) var(--e-geste)}
.nav>button:hover::after,.nav>button[aria-expanded="true"]::after,.nav>button[aria-current="page"]::after{transform:scaleX(1);transform-origin:left}
.nav>button[aria-current="page"]{color:var(--encre)}
.outils{margin-left:auto;display:flex;align-items:center;gap:4px}
.outils button{font-size:15px;color:var(--encre2);padding:0 12px;min-height:44px}
.outils button:hover{color:var(--encre)}
.cnt{display:inline-block;min-width:20px;font-variant-numeric:tabular-nums;margin-left:5px}
.menu-mob{display:none}

/* ═══ barre de livraison (filtres PLP) ═══ */
.liv{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 44px 26px}
.liv__b{display:flex;align-items:center;gap:12px;border:1px solid var(--arete);padding:0 18px;min-height:48px;
 font-size:15px;transition:border-color var(--m-touche) var(--e-touche)}
.liv__b:hover{border-color:var(--encre)}
.liv__b b{font-weight:600}
.liv__b span{color:var(--encre2);font-size:14px}
.liv__b u{text-decoration:none;color:var(--encre2);font-size:14px;position:relative}
.liv__b u::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:currentColor}

/* ═══ boutons ═══ */
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--encre);color:var(--papier);
 padding:16px 28px;font-size:15px;min-height:44px;position:relative;overflow:hidden;z-index:0;
 transition:color var(--m-geste) var(--e-geste)}
.b::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--or);
 transform:translateY(101%);transition:transform var(--m-geste) var(--e-passage)}
.b:hover::before{transform:none}
.b--o{background:transparent;color:var(--encre);border:1px solid var(--arete)}
.b--o:hover{color:var(--papier)}
.b--o::before{background:var(--encre)}
.b--blanc{background:var(--blanc);color:var(--encre)}
.b--blanc:hover{color:var(--blanc)}
.b--blanc::before{background:var(--encre)}
.b--s{padding:11px 18px;font-size:14px}
.b--w{width:100%}
.b:active{transform:scale(.99)}

/* ═══ mentions (texte, jamais de pastille) ═══ */
.men{font-size:12px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--encre2)}
.men--s{color:var(--saison)}
.et{display:flex;align-items:baseline;gap:7px;font-size:14px;color:var(--encre2)}
.et--a{color:var(--saison)}

/* ═══ vues ═══ */
.vue{display:none}.vue.on{display:block}
.vue--sort{position:fixed;left:0;right:0;z-index:55;pointer-events:none;background:var(--papier);will-change:opacity}
.voyage{position:fixed;z-index:75;overflow:hidden;pointer-events:none;contain:paint;will-change:transform,opacity}
.voyage>i{position:absolute;inset:0;display:block;background-size:cover;background-position:center;will-change:transform}
.masque-cible{opacity:0}
@media(prefers-reduced-motion:reduce){.vue--sort,.voyage{display:none}}
.rev{opacity:0;transform:translateY(20px);transition:opacity var(--m-souffle) var(--e-passage),transform var(--m-souffle) var(--e-passage)}
.rev.vu{opacity:1;transform:none}
.sans-reveal .rev{transition:none!important}
.masque{display:block;overflow:hidden}

/* ═══ bandes plein cadre — une seule survit ═══ */
.bnd{position:relative;min-height:76vh;display:grid;place-items:center;overflow:hidden;isolation:isolate}
.bnd .ph{position:absolute;inset:0;z-index:-1}
.bnd::after{content:"";position:absolute;inset:0;z-index:-1;
 background:linear-gradient(180deg,rgba(0,20,45,.5),rgba(0,20,45,.2) 44%,rgba(0,20,45,.62))}
.bnd__t{text-align:center;color:#fff;padding:80px 32px;max-width:42ch;display:grid;gap:22px;justify-items:center}
.bnd__t .t12{color:rgba(255,255,255,.86)}

/* ═══ sections ═══ */
.bande{padding:64px 44px;border-bottom:1px solid var(--filet)}
.bande__h{display:flex;align-items:baseline;gap:16px;margin-bottom:34px;flex-wrap:wrap}
.lien{position:relative}
.bande__h .lien{margin-left:auto;font-size:14px;color:var(--encre2);min-height:44px;display:inline-flex;align-items:center;position:relative}
.bande__h .lien::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:1px;background:currentColor;
 transform:scaleX(0);transform-origin:right;transition:transform var(--m-geste) var(--e-geste)}
.bande__h .lien:hover::after{transform:scaleX(1);transform-origin:left}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}

/* ═══ carte création ═══ */
.crea{display:block;width:100%;color:inherit}
.crea__im{display:block;position:relative;aspect-ratio:4/5;overflow:hidden;margin-bottom:16px;background:#E8E3D9}
.crea__im .ph{position:absolute;inset:0;transition:opacity .42s var(--e-geste)}
.crea__im .ph.b2{opacity:0}
.crea:hover .crea__im .ph.b2,.crea:focus-visible .crea__im .ph.b2{opacity:1}
.crea__m{position:absolute;left:0;top:0;padding:12px 14px;z-index:2;color:#fff;text-shadow:0 1px 10px rgba(20,19,15,.6)}
.crea__coupe{position:absolute;right:14px;bottom:12px;z-index:2;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
 font-weight:600;color:#fff;text-shadow:0 1px 10px rgba(20,19,15,.7);opacity:0;transition:opacity var(--m-geste) var(--e-geste)}
.crea:hover .crea__coupe{opacity:1}
.crea__d{display:block;font-size:14px;color:var(--encre2);line-height:1.5;margin:8px 0 12px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ═══ utilitaires ═══ */
function pr(n){return n.toFixed(2).replace('.',',')+' €';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function T_(id){for(var i=0;i<C.length;i++)if(C[i].id===id)return C[i];return null;}

 if(p.length)out.push('à partager '+p.map(function(x){return x[1].toFixed(2).replace('.',',');}).join(' / ')+' €');
 return out.join(' — ');
}

/* ═══ moteur de mouvement ═══ */
function rectDe(x){if(!x)return null;if(x.getBoundingClientRect){var r=x.getBoundingClientRect();
 return{left:r.left,top:r.top,width:r.width,height:r.height};}return x;}
function voyage(dep,arr,duree,src){
 if(RM.matches)return null;
 var a=rectDe(dep),b=rectDe(arr);
 if(!a||!b||!a.width||!b.width)return null;
 var im=getComputedStyle(src||arr||dep).backgroundImage;
 if(!im||im==='none')im=getComputedStyle(dep).backgroundImage;
 if(!im||im==='none')return null;
 var w=document.createElement('div'),i=document.createElement('i');
 w.className='voyage';i.style.backgroundImage=im;w.appendChild(i);
 w.style.cssText+='left:'+b.left+'px;top:'+b.top+'px;width:'+b.width+'px;height:'+b.height+'px';
 document.body.appendChild(w);
 var sx=a.width/b.width,sy=a.height/b.height,
     dx=(a.left+a.width/2)-(b.left+b.width/2),dy=(a.top+a.height/2)-(b.top+b.height/2),
     o={duration:duree,easing:E_PASS,fill:'both'};
 var A=w.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')'},{transform:'none'}],o);
 i.animate([{transform:'scale('+(1/sx)+','+(1/sy)+')'},{transform:'none'}],o);
 w.animate([{opacity:0},{opacity:1}],{duration:120,easing:'linear',fill:'backwards'});
 var net=function(){if(w.parentNode)w.remove();};
 A.finished.then(net,net);
 return{el:w,anim:A};
}
function entree(racine,sel,depart){
 if(RM.matches||!racine)return;
 [].slice.call(racine.querySelectorAll(sel)).slice(0,6).forEach(function(e,n){
  e.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],
   {duration:D_PASS,delay:(depart||0)+n*PAS,easing:E_PASS,fill:'backwards'});});
}
function chiffre(el,txt,sens){
 if(!el)return;
 if(RM.matches||el.textContent===txt){if(el)el.textContent=txt;return;}
 sens=sens||1;
 var p=el.parentNode;
 if(!p.classList.contains('roule')){var b=document.createElement('span');b.className='roule';
  p.insertBefore(b,el);b.appendChild(el);p=b;}
 var vx=el.cloneNode(true);vx.className+=' roule__sort';p.appendChild(vx);
 el.textContent=txt;
 var net=function(){if(vx.parentNode)vx.remove();};
 vx.animate([{transform:'none',opacity:1},{transform:'translateY('+(-100*sens)+'%)',opacity:0}],
  {duration:180,easing:E_TOUCHE,fill:'both'}).finished.then(net,net);
 el.animate([{transform:'translateY('+(100*sens)+'%)',opacity:0},{transform:'none',opacity:1}],
  {duration:220,easing:E_PASS,fill:'both'});
}

/* ═══ révélation ═══ */
var IO=null;
function revele(portee){
 var racine=portee?document.querySelector(portee):document;
 if(!racine)return;
 if(!('IntersectionObserver' in window)||RM.matches){
  racine.querySelectorAll('.rev').forEach(function(e){e.classList.add('vu');});return;}
 if(!IO)IO=new IntersectionObserver(function(es){es.forEach(function(x){
   if(x.isIntersecting){x.target.classList.add('vu');IO.unobserve(x.target);}});},
   {rootMargin:'0px 0px -6%',threshold:.06});
 racine.querySelectorAll('.rev:not(.vu)').forEach(function(e){IO.observe(e);});
}
function revelerTout(portee){
 (portee?document.querySelector(portee):document).querySelectorAll('.rev').forEach(function(e){e.classList.add('vu');});
}

 if(arr){var r=arr.getBoundingClientRect();if(r.bottom<40||r.top>innerHeight-40)arr=null;}
 if(o.depart&&document.contains(o.depart)&&arr){
  arr.classList.add('masque-cible');
  V=voyage(o.depart,arr,o.retour?D_RETOUR:D_PASS);
  var rev=function(){arr.classList.remove('masque-cible');};
  if(V)V.anim.finished.then(rev,rev);else rev();
 }
 sort.animate([{opacity:1},{opacity:0}],{duration:D_SORTIE,easing:E_TOUCHE,fill:'forwards'})
  .finished.then(function(){sort.classList.remove('on','vue--sort');sort.style.top='';});

 revele('#v-'+v);brancheCar();
 ent.focus({preventScroll:true});
}

 g+='<div><span>'+(S.mode==='retrait'?'Retrait — '+LIEUX[S.lieu].n:(S.mode==='livraison'?'Livraison Paris intra-muros':'Expédition en France'))+

 if(S.mode==='livraison'&&reste>0)g+='<div style="display:block"><div class="jauge"><span style="width:'+Math.min(100,st/FRANCO*100)+'%"></span></div><span class="t14 sais">Plus que '+pr(reste)+' pour la livraison offerte</span></div>';
 g+='<div class="tot"><span>Total</span><span class="num">'+pr(base+liv)+'</span></div></div>'+
  '<button class="b b--w" data-action="checkout">Payer ma commande — <span class="num">'+pr(base+liv)+'</span></button>'+

  JNOM[S.jour]+' '+S.jour+' août'+(S.mode==='retrait'?', '+S.cren+', '+LIEUX[S.lieu].n:'')+
  (S.jour>S.jour?' — sous réserve de décaler votre commande, voir ci-dessus':'')+'. <button class="lien" data-service="panier">Modifier</button></p>'+
  '<p class="t14 dim" style="margin-top:8px">Commande avec obligation de paiement.</p>';
 fo.innerHTML=g;
}

/* ═══ panneaux ═══ */
function focusables(el){return [].slice.call(el.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])'))
 .filter(function(e){return e.offsetParent!==null||e===document.activeElement;});}
function ouvre(el,focusInitial){
 DERNIER=document.activeElement;
 document.getElementById('voile').classList.add('on');
 el.classList.add('on');el.setAttribute('aria-hidden','false');
 if(MAIN)MAIN.inert=true;
 if(!RM.matches)[].slice.call(el.querySelectorAll('.ligne,.alerte,.recap,.lieux button')).slice(0,6)
  .forEach(function(x,n){x.animate([{opacity:0,transform:'translateX(14px)'},{opacity:1,transform:'none'}],
   {duration:D_PASS,delay:140+n*PAS,easing:E_PASS,fill:'backwards'});});
 setTimeout(function(){var f=focusInitial?el.querySelector(focusInitial):null;
  if(!f){var l=focusables(el);f=l[0];}
  if(f)f.focus();},70);
 el._piege=function(ev){if(ev.key!=='Tab')return;
  var f=focusables(el);if(!f.length)return;
  var pre=f[0],der=f[f.length-1];
  if(ev.shiftKey&&document.activeElement===pre){ev.preventDefault();der.focus();}
  else if(!ev.shiftKey&&document.activeElement===der){ev.preventDefault();pre.focus();}};
 el.addEventListener('keydown',el._piege);
}
function ferme(){
 ['tiroir','modale','rech'].forEach(function(i){var x=document.getElementById(i);
  if(x._piege){x.removeEventListener('keydown',x._piege);x._piege=null;}
  x.classList.remove('on');x.setAttribute('aria-hidden','true');});
 document.getElementById('voile').classList.remove('on');
 fermeMega();
 if(MAIN)MAIN.inert=false;
 if(DERNIER&&document.contains(DERNIER)){DERNIER.focus();DERNIER=null;}
}
function fermeMega(){
 var m=document.getElementById('mega');m.classList.remove('on');
 ['btn-mega','btn-menu'].forEach(function(i){var b=document.getElementById(i);if(b)b.setAttribute('aria-expanded','false');});
}

/* ═══ recherche ═══ */
function rech(q){
 var r=document.getElementById('rech-r');q=(q||'').trim().toLowerCase();
 var norm=function(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();};
 if(!q){r.innerHTML='<p class="t14 dim">Essayez « sans gluten », « 8 personnes », « chocolat », « citron ».</p>';return;}
 var nq=norm(q);
 var l=C.filter(function(c){
  return norm(c.n+' '+c.d+' '+c.c+' '+c.f.map(function(x){return x[0];}).join(' ')+(c.sg?' sans gluten':'')).indexOf(nq)>=0;}).slice(0,6);
 r.innerHTML=l.length?l.map(function(c){
  return '<a class="rr" href="#" data-fiche="'+c.id+'">'+ph(c.im,c.alt)+
   '<span><b class="g22">'+c.n+'</b><br><span class="t14 dim">'+prixLigne(c)+'</span></span>'+
   '<span class="t14 dim">'+(dispoC(c)?'disponible':'retrait ou livraison')+'</span></a>';}).join('')
  :'<p class="t16">Aucune création ne correspond à « '+esc(q)+' ». <button class="lien" data-go="collection" data-col="tout">Voir les '+C.length+' créations</button></p>';
}

/* ═══ carrousels ═══ */
function majFleches(id){
 var p=document.getElementById('car-'+id),n=document.querySelector('[data-car="'+id+'"]');
 if(!p||!n)return;
 var max=p.scrollWidth-p.clientWidth-2;
 n.querySelector('[data-dir="-1"]').disabled=p.scrollLeft<=2;
 n.querySelector('[data-dir="1"]').disabled=p.scrollLeft>=max;
}
function brancheCar(){
 document.querySelectorAll('.car__p').forEach(function(p){
  if(p._b)return;p._b=1;
  var id=p.id.slice(4);
  p.addEventListener('scroll',function(){majFleches(id);},{passive:true});
  majFleches(id);});
}

 annonce(resumeLiv()+'. '+nbDispo()+' créations disponibles.');
 if(ORIG==='fiche'&&F){vFiche();}

 if(t.id==='btn-mega'||t.id==='btn-menu'){

 if(D.retour!=null){var r=RETOUR||{vue:'collection'};

 if(D.fc){var i=FIL.indexOf(D.fc);if(i>=0)FIL.splice(i,1);else FIL.push(D.fc);

 if(D.lq){var pa=D.lq.split('|'),li=+pa[0],dq=+pa[1];

 if(t.id==='oter'){PANIER=PANIER.filter(function(l){return dispoC(T_(l.id));});majPanier();return;}
 if(D.opt){var o=OPT.indexOf(D.opt);if(o>=0)OPT.splice(o,1);else OPT.push(D.opt);majPanier();
